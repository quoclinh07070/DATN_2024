
<section class="login-section mt-4">
  <div class="auto-container">
      <h2 class="text-center">Đặt Lại Mật Khẩu</h2>
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()">
        <!-- Input Mật khẩu -->
        <div class="form-group">
          <label for="password">Mật khẩu mới:</label>
          <input 
            type="password" 
            id="password" 
            formControlName="password" 
            placeholder="Nhập mật khẩu mới" 
            class="form-control"
          />
          <div *ngIf="resetPasswordForm.controls['password'].invalid && resetPasswordForm.controls['password'].touched" class="error-message">
            <small *ngIf="resetPasswordForm.controls['password'].errors?.['required']">Mật khẩu là bắt buộc.</small>
            <small *ngIf="resetPasswordForm.controls['password'].errors?.['minlength']">Mật khẩu phải có ít nhất 6 ký tự.</small>
          </div>
        </div>
    
        <!-- Input Xác nhận mật khẩu -->
        <div class="form-group">
          <label for="confirmPassword">Xác nhận mật khẩu:</label>
          <input 
            type="password" 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            placeholder="Nhập lại mật khẩu" 
            class="form-control"
          />
          <div *ngIf="resetPasswordForm.controls['confirmPassword'].invalid && resetPasswordForm.controls['confirmPassword'].touched" class="error-message">
            <small *ngIf="resetPasswordForm.controls['confirmPassword'].errors?.['required']">Xác nhận mật khẩu là bắt buộc.</small>
          </div>
        </div>
    
        <!-- Submit Button -->
        <button type="submit" [disabled]="resetPasswordForm.invalid" class="btn btn-primary">
          Đặt Lại Mật Khẩu
        </button>
      </form>
    
      <!-- Success and Error Messages -->
      <p *ngIf="message" class="success-message">{{ message }}</p>
      <p *ngIf="error" class="error-message">{{ error }}</p>
    </div>
</section>
