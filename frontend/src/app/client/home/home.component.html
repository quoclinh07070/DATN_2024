<!--slider section start-->
<div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
    <ol class="carousel-indicators">
      <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
      <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
      <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
      <li data-target="#carouselExampleIndicators" data-slide-to="3"></li>
    </ol>
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img class="d-block w-100" src="./assets/client/images/banner/Banner.png" alt="First slide">
      </div>
      <div class="carousel-item">
        <img class="d-block w-100" src="./assets/client/images/banner/Banner1.png" alt="Second slide">
      </div>
      <div class="carousel-item">
        <img class="d-block w-100" src="./assets/client/images/banner/Banner2.png" alt="Third slide">
      </div>
    </div>
    <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>
  </div>
  <!--slider section end-->
  
  <!--Sidebar Page Container-->
  <div class="sidebar-page-container">
    <div class="auto-container">
      <div class="row clearfix">
  
        <!--Content Side-->
        <div class="content-side col-xl-12 col-lg-12 col-md-12 p-5">
          <h2 class="text-center fw-bold text-dark mb-4">SẢN PHẨM MỚI NHẤT</h2>
          <div class="our-shop">
            <div class="row g-4">
              <div
                class="col-lg-3 col-md-4 col-sm-6"
                *ngFor="let product of newestProducts"
              >
                <div class="product-card shadow-sm">
                  <div class="image-box position-relative">
                    <img
                      [src]="getImageUrl(product.image)"
                      alt="{{ product.name }}"
                      class="w-100 img-fluid rounded"
                    />
                    <div class="overlay d-flex justify-content-center align-items-center"  [routerLink]="['/product-detail', product.id]">
                        <img [src]="getImageUrl(product.image)" alt="Hover Image" class="hover-image">
                      </div>
                      
                  </div>
                  <div class="product-info text-center mt-3">
                    <h5 class="text-truncate">{{ product.name }}</h5>
                    <p class="price text-danger fw-bold mb-0">
                      {{ product.price | number:'1.0-0' }} ₫
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        
      <!--Post Share Options-->
      <div class="styled-pagination">
        <ul class="clearfix">
          <li class="prev-post"><a href="#"><span class="fa fa-long-arrow-left"></span> Prev</a></li>
          <li><a href="#">1</a></li>
          <li class="active"><a href="#">2</a></li>
          <li><a href="#">3</a></li>
          <li class="next-post"><a href="#"> Next <span class="fa fa-long-arrow-right"></span> </a></li>
        </ul>
      </div>
    </div>
  
    <!-- News Section -->
    <section class="news-section">
      <div class="auto-container">
        <div class="sec-title">
          <span class="float-text">Blogs</span>
          <h2 class="text-center fw-bold text-dark mb-3">BÀI VIẾT MỚI NHẤT</h2>
        </div>
        <div class="row">
            <div class="container">
               
                <div class="row g-4">
                  <div class="col-lg-4 col-md-6 col-sm-12" *ngFor="let post of posts">
                    <div class="card shadow-sm blog-card">
                        <div class="image-box position-relative" [routerLink]="['/blog/blog-detail', post.id]">
                            <img
                                [src]="getImageUrl(post.image_url)"
                                alt="{{ post.title }}"
                                class="w-100 img-fluid rounded"
                            />
                            <!-- Đảm bảo căn giữa overlay -->
                            <div class="overlay d-flex justify-content-center align-items-center">
                                <a [routerLink]="['/blog/blog-detail', post.id]" class="text-white">
                                </a>
                            </div>
                        </div>
                        <div class="card-body" [routerLink]="['blog/blog-detail', post.id]">
                            <h5 class="card-title text-truncate">{{ post.title }}</h5>
                            <p class="card-text text-muted small mb-2">
                                {{ post.created_at | date: 'dd/MM/yyyy' }}
                            </p>
                        </div>
                    </div>
                    
                    </div>
                  </div>
                </div>
              </div>
              
          </div>
  
          <!-- News Block -->
          
       
      
    </section>
    <!--End News Section -->
  
  </div>
