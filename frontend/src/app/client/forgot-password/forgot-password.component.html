
<section class="login-section mt-4">
  <div class="auto-container">
    <h2 class="text-center">Đặt Lại Mật Khẩu</h2>
    <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <!-- Input Email -->
      <div class="form-group">
        <label for="email">Email:</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Nhập địa chỉ email của bạn" 
          class="form-control"
        />
        <div *ngIf="forgotPasswordForm.controls['email'].invalid && forgotPasswordForm.controls['email'].touched" class="error-message">
          <small *ngIf="forgotPasswordForm.controls['email'].errors?.['required']">Email là bắt buộc.</small>
          <small *ngIf="forgotPasswordForm.controls['email'].errors?.['email']">Địa chỉ email không hợp lệ.</small>
        </div>
      </div>
  
      <!-- Submit Button -->
      <button type="submit" [disabled]="forgotPasswordForm.invalid" class="btn btn-primary">
        Gửi
      </button>
    </form>
  
    <!-- Success and Error Messages -->
    <p *ngIf="message" class="success-message">{{ message }}</p>
    <p *ngIf="error" class="error-message">{{ error }}</p>
  </div>
</section>
