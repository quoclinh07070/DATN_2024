<div class="user-info-container formUser">
  <!-- Popup Success Alert -->
  <div
    *ngIf="isPopupVisible"
    class="popup-success-alert"
    id="popupSuccessAlert"
    role="alert"
  >
    <div class="popup-content">
      <div [ngClass]="isSuccess ? 'icon-success' : 'icon-error'">
        <span>{{ isSuccess ? "&#10003;" : "&#10007;" }}</span>
      </div>
      <p class="message">{{ popupMessage }}</p>
      <button type="button" class="btn-close" (click)="closePopup()">
        Đóng
      </button>
    </div>
  </div>

  <h2><i class="bi bi-person-circle"></i> Thông Tin Người Dùng</h2>

  <div *ngIf="!isLoggedIn" class="not-logged-in">
    <p class="login-message">
      Bạn chưa đăng nhập, vui lòng đăng nhập để xem thêm thông tin hoặc đăng ký
      nếu chưa có tài khoản!
    </p>
    <div class="auth-buttons">
      <button class="login-btn" (click)="navigateToLogin()">Đăng Nhập</button>
      <button class="register-btn" (click)="navigateToRegister()">
        Đăng Ký
      </button>
    </div>
  </div>

  <div *ngIf="isLoggedIn">
    <div class="container-xl px-4 mt-4">
      <!-- Account page navigation-->
      <nav class="nav nav-borders">
          <a class="nav-link active ms-0" routerLink="/user">Hồ sơ</a>
          <a class="nav-link" >Đơn hàng</a>
          <a class="nav-link" >Thông báo</a>
          <a class="nav-link" >Cài đặt</a>
      </nav>
      <hr class="mt-0 mb-4">
      <div class="row">
          <div class="col-xl-4">
              <!-- Profile picture card-->
              <div class="card mb-4 mb-xl-0">
                  <div class="card-header">Ảnh đại diện</div>
                  <div class="card-body text-center">
                      <!-- Profile picture image-->
                      <img class="img-account-profile rounded-circle mb-2" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="User image">
                      <!-- Profile picture help block-->
                      <div class="small font-italic text-muted mb-4">JPG or PNG no larger than 5 MB</div>
                      <!-- Profile picture upload button-->
                      <button class="btn btn-primary" type="button">Tải ảnh của bạn lên</button>
                  </div>
              </div>
          </div>
          <div class="col-xl-8">
              <!-- Account details card-->
              <div class="card mb-4">
                  <div class="card-header">Thông tin tài khoản</div>
                  <div class="card-body">
                      <form>
                          <!-- Form Group (username)-->
                          <div class="mb-3">
                              <label class="small mb-1" for="inputUsername">Tên người dùng ( sẽ được hiển thị trên website và được thấy bởi người dùng khác )</label>
                              <input class="form-control" id="inputUsername" type="text" placeholder="{{userName}}">
                          </div>
                          <!-- Form Group (email address)-->
                          <div class="mb-3">
                              <label class="small mb-1" for="inputEmailAddress">Email ( bạn sẽ không thay đổi được email )</label>
                              <input class="form-control" id="inputEmailAddress" type="email" placeholder="{{userEmail}}">
                          </div>
                          <!-- Form Group (address)-->
                          <div class="mb-3">
                            <label class="small mb-1" for="inputAddress">Địa chỉ</label>
                            <input class="form-control" id="inputAddress" type="text" placeholder="Nhập địa chỉ của bạn">
                        </div>
                          <!-- Form Group (phone number)-->
                          <div class="mb-3">
                            <label class="small mb-1" for="inputPhone">Số điện thoại</label>
                            <input class="form-control" id="inputPhone" type="tel" placeholder="Nhập số điện thoại của bạn">
                        </div>
                          <!-- Form Row-->
                          <div class="row gx-3 mb-3">
                              <!-- Form Group (phone number)-->
                              <div class="col-md-6">
                                <label for="gender" class="small mb-1">Giới tính:</label>
                                <select class="form-select" id="gender" name="gender">
                                  <option value="male">Nam</option>
                                  <option value="female">Nữ</option>
                                  <option value="other">Khác</option>
                                </select>
                              </div>
                              <!-- Form Group (birthday)-->
                              <div class="col-md-6">
                                  <label class="small mb-1" for="inputBirthday">Ngày sinh</label>
                                  <input class="form-control" id="inputBirthday" type="date" name="birthday" placeholder="Nhập ngày sinh của bạn">
                              </div>
                          </div>
                          <!-- Save changes button-->
                          <button class="btn btn-primary" type="button">LƯU THAY ĐỔI</button>
                      </form>
                      <button class="logout-btn" (click)="onLogoutConfirm()">Đăng Xuất</button>
                  </div>
              </div>
          </div>
      </div>
    </div>
  </div>


</div>



<script>
  function openTab(evt, tabName) {
    var i, tabcontent, tablinks;
    tabcontent = document.getElementsByClassName("tab-content");
    for (i = 0; i < tabcontent.length; i++) {
      tabcontent[i].style.display = "none";
      tabcontent[i].classList.remove("active");
    }
    tablinks = document.getElementsByClassName("tab-link");
    for (i = 0; i < tablinks.length; i++) {
      tablinks[i].className = tablinks[i].className.replace(" active", "");
    }
    document.getElementById(tabName).style.display = "block";
    document.getElementById(tabName).classList.add("active");
    evt.currentTarget.className += " active";
  }

  // Set default open tab when page loads
  window.onload = function () {
    document.getElementById("infoTab").style.display = "block";
    document.querySelector(".tab-link").classList.add("active");
  };
</script>
