<div class="sidebar-page-container mt-5">
  <div class="auto-container">
      <div class="row clearfix">
        <div class="col-lg-12 col-md-12 col-sm-12 col-xs-12">
          <ol class="breadcrumb">
              <li class="breadcrumb-item">
                  <a routerLink="/"><span>Trang chủ</span></a>
              </li>
              <li class="breadcrumb-item">
                  <a routerLink="/product"><span>Sản phẩm</span></a>
              </li>
          </ol>
        </div>
          <!--Sidebar Side-->
          <div class="sidebar-side col-xl-3 col-lg-4 col-md-12">
              <aside class="sidebar">
                  <!--Blog Category Widget-->
                  <div class="sidebar-widget sidebar-blog-category">
                      <div class="sidebar-title">
                          <h3>Loại sản phẩm</h3>
                          <div class="separater"></div>
                      </div>
                      <ul class="cat-list">
                        <li *ngFor="let category of categories" class="clearfix">
                          <button class="btnCate" type="button" (click)="onCategorySelect(category.id)">
                            {{ category.name }}
                        </button>
                        </li>
                    </ul>
                    <button type="button" (click)="resetFilters()" class="btn-style-one btnFilter">Làm mới</button>

                  </div>
                  
                  <!-- Price Filters -->
                   <!-- Price Filters -->
                <form [formGroup]="priceForm" (ngSubmit)="loadProducts()" class="filter-form">
                  <div class="sidebar-widget price-filters rangeslider-widget">
                      <div class="sidebar-title">
                          <h3>Lọc theo giá</h3>
                          <div class="separater"></div>
                      </div>
                      <div class="price-range-filter__inputs box-filter-price">
                          <input type="text" min="0" pattern="[0-9]*" maxlength="13" formControlName="minPrice" class="price-range-filter__input filter__input_to" placeholder="₫ TỪ">
                          <span class="price-range-filter__range-line"></span>
                          <input type="text" min="0" pattern="[0-9]*" maxlength="13" formControlName="maxPrice" class="price-range-filter__input filter__input_from" placeholder="₫ ĐẾN">
                      </div>
                      <button type="submit" class="thêm-btn btn-style-one btnFilter">Lọc</button>
                      <button type="button" (click)="resetFilters()" class="btn-style-one btnFilter">Làm mới</button>
                  </div>
              </form>
              </aside>
          </div>
          <!--Content Side-->
          <div class="content-side col-xl-9 col-lg-8 col-md-12">
              <div class="text text-center mb-3">
                  <h3>Tất cả sản phẩm</h3>
              </div>
              <div class="our-shop">
                <div class="row clearfix">
                  <div *ngFor="let product of products" class="shop-item col-xl-4 col-lg-6 col-md-6 col-sm-12">
                    <div class="inner-box">
                      <div class="image">
                        <img [src]="getImageUrl(product.image)" alt="{{ product.name }}" class="img-fluid" />
                        <div class="overlay-box">
                          <ul class="cart-option">
                            <li><a [routerLink]="['/product-detail', product.id]"><span class="bi bi-search"></span></a></li>
                            <li><a (click)="addToCart(product)"><span class="bi bi-cart-plus"></span></a></li>
                          </ul>
                        </div>
                      </div>
                      <div class="lower-content">
                        <h3><a [routerLink]="['/product-detail', product.id]">{{ product.name }}</a></h3>
                        <div class="price">{{ product.price | currency: 'VND' }}</div>
                        <div class="clearfix">
                          <div class="pull-left">
                            <!-- Thêm sản phẩm vào giỏ -->
                            <!-- <a class="add-cart" routerLink="/cart" (click)="addToCart(product)"><span class="fa fa-cart-plus"></span> Thêm vào giỏ hàng</a> -->
                            <a class="add-cart" (click)="addToCart(product)"><span class="fa fa-cart-plus"></span> Thêm vào giỏ hàng</a>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              
            </div>
          
      </div>
  </div>
</div>
<!--End Sidebar Page Container-->
<style>
  .box-filter-price{ 
    display : flex;
    justify-content: space-between;
    align-items: center;
  }
  .price-range-filter__input {
    background: #ffffff;
    background-clip: padding-box;
    border: 1px solid #c2c2c2;
    border-radius: 1px;
    font-family: 'Open Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    font-size: 14px;
    height: 32px;
    line-height: 1.42857143;
    padding: 0 9px;
    vertical-align: baseline;
    width: 100%;
    box-sizing: border-box;
  }
  .price-range-filter__range-line {
    -webkit-flex: 1;
    -moz-box-flex: 1;
    -ms-flex: 1;
    flex: 1;
    height: 1px;
    background: #bdbdbd;
    margin: 0 .625rem;
  }
  .btnFilter {
    width : 100%;
    margin-top: 10px;
  }
  .btnCate {
    font-size: larger;
    margin: 10px 10px 10px 10px;
    background-color: unset;
  }
</style>
