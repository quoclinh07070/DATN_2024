<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">
  <div class="body-wrapper">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12">
          <div class="d-flex justify-content-between align-items-center mt-2">
            <h3 class="mb-0">SẢN PHẨM</h3>
            <a class="btn btn-success" routerLink="add">Thêm sản phẩm</a>
          </div>
          <div class="card mt-3">
            <div class="card-body">
              <div class="table-responsive mt-3">
                <table class="table table-hover table-bordered text-nowrap">
                  <thead class="table-dark text-white text-center align-middle">
                    <tr>
                      <th scope="col" class="py-3">ID</th>
                      <th scope="col" class="py-3">Tên sản phẩm</th>
                      <th scope="col" class="py-3">Hình ảnh</th>
                      <th scope="col" class="py-3">Giá</th>
                      <th scope="col" class="py-3">Giảm giá(%)</th>
                      <th scope="col" class="py-3">Số lượng</th>
                      <th scope="col" class="py-3">Trạng thái</th>
                      <th scope="col" class="py-3">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr
                      *ngFor="let product of getPagedData()"
                      [ngClass]="{
                        'table-light': product.status === 'active',
                        'table-danger': product.status !== 'active'
                      }"
                    >
                      <th scope="row" class="text-center align-middle">
                        {{ product.id }}
                      </th>
                      <td class="text-center align-middle">
                        {{ product.name }}
                      </td>
                      <td class="text-center align-middle">
                        <img
                          [src]="getImageUrl(product.image)"
                          alt="{{ product.name }}"
                          class="img-thumbnail"
                          style="max-width: 60px; height: auto"
                        />
                      </td>
                      <td class="text-center align-middle">
                        {{ product.price | number : "1.0-0" }} ₫
                      </td>
                      <td class="text-center align-middle">
                        {{ product.discount }}
                      </td>
                      <td class="text-center align-middle">
                        {{ product.quantity }}
                      </td>
                      <td class="text-center align-middle">
                        <span
                          class="badge"
                          [ngClass]="{
                            'bg-success': product.status === 'active',
                            'bg-danger': product.status !== 'active'
                          }"
                        >
                          {{
                            product.status === "active"
                              ? "Kích hoạt"
                              : "Vô hiệu hóa"
                          }}
                        </span>
                      </td>
                      <td class="text-center align-middle">
                        <div
                          class="d-flex justify-content-center align-items-center gap-2"
                        >
                          <a
                            class="btn btn-sm btn-info"
                            routerLink="edit/{{ product.id }}"
                            >Sửa</a
                          >
                          <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            (click)="deleteProduct(product.id)"
                          >
                            Xóa
                          </button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
                <div class="d-flex justify-content-center mt-3">
                  <nav>
                    <ul class="pagination">
                      <li
                        class="page-item"
                        [class.disabled]="currentPage === 1"
                      >
                        <button
                          class="page-link"
                          (click)="goToPage(currentPage - 1)"
                          [disabled]="currentPage === 1"
                        >
                          Trước
                        </button>
                      </li>
                      <li
                        class="page-item"
                        *ngFor="let page of getPaginationArray()"
                        [class.active]="page === currentPage"
                      >
                        <button class="page-link" (click)="goToPage(page)">
                          {{ page }}
                        </button>
                      </li>
                      <li
                        class="page-item"
                        [class.disabled]="currentPage === getTotalPages()"
                      >
                        <button
                          class="page-link"
                          (click)="goToPage(currentPage + 1)"
                          [disabled]="currentPage === getTotalPages()"
                        >
                          Tiếp theo
                        </button>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
