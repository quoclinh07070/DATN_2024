<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">
  <div class="body-wrapper">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12">
          <div class="d-flex justify-content-between align-items-center mt-2">
            <h3 class="mb-0">DANH MỤC SẢN PHẨM</h3>
            <a class="btn btn-success ms-2" routerLink="add">Thêm sản phẩm</a>
          </div>
          <div class="d-flex align-items-center mt-3">
            <label for="searchTerm" class="mr-2">Lọc:</label>
            
            <!-- Tìm kiếm -->
            <input 
              type="text" 
              id="searchTerm" 
              class="form-control simple-search-input mr-3" 
              style="width: 220px;"
              placeholder="Tìm kiếm danh mục... 🔍" 
              [(ngModel)]="searchTerm"
              (input)="filterCategories()" 
            />
            
            <!-- Lọc theo trạng thái -->
            <select class="form-control" [(ngModel)]="selectedStatus" (change)="filterCategories()" style="width: 170px;">
              <option value="">Tất cả trạng thái ⌵</option>
              <option value="active">Hoạt động</option>
              <option value="inactive">Không hoạt động</option>
            </select>
            </div>
          
            
          <div class="card mt-3">
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover table-bordered text-nowrap">
                  <thead class="table-dark text-white text-center align-middle">
                    <tr>
                      <th>ID</th>
                      <th>Tên danh mục</th>
                      <th>Hình ảnh</th>
                      <th>Mô tả</th>
                      <!-- <th>ID Danh mục cha</th> -->
                      <th>Trạng thái</th>
                      <th>Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr 
                      *ngFor="let category of filteredCategories" 
                      [ngClass]="{'table-light': category.status === 'active', 'table-danger': category.status !== 'active'}">
                      <th scope="row">{{category.id}}</th>
                      <td class="text-center align-middle">{{category.category_name}}</td>
                      <td class="text-center align-middle">
                        <img [src]="getImageUrl(category.images)" alt="{{category.category_name}}" class="img-fluid" style="max-width: 60px;">
                      </td>
                      <td class="text-truncate" style="max-width: 120px;">{{category.description}}</td>
                      <!-- <td>{{category.parent_categoryID}}</td> -->
                      <td class="text-center align-middle">
                        <span class="badge" [ngClass]="{'bg-success': category.status === 'active', 'bg-danger': category.status !== 'active'}">
                          {{ category.status === 'active' ? 'Kích hoạt' : 'Vô hiệu hóa' }}
                        </span>
                      </td>

                      <td class="text-center align-middle">
                        <a class="btn btn-info btn-sm" routerLink="edit/{{category.id}}">Sửa</a>
                        <button type="button" class="btn btn-danger btn-sm" (click)="deleteCategory(category.id)">Xóa</button>
                      </td>
                    </tr>
                  </tbody>
                  
                </table>
                
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
