<div class="page-wrapper" id="main-wrapper" data-layout="vertical" data-navbarbg="skin6" data-sidebartype="full" data-sidebar-position="fixed" data-header-position="fixed">
  <div class="body-wrapper">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12">
          <div class="d-flex justify-content-between align-items-center mt-2">
            <h3 class="mb-0">DANH MỤC SẢN PHẨM</h3>
            <a class="btn btn-success ms-2" routerLink="add">Thêm danh mục</a>
          </div>
          <div class="d-flex align-items-center mt-3">
            <label for="searchTerm" class="mr-2">Lọc:</label>
            
            <!-- Tìm kiếm -->
            <input 
              type="text" 
              id="searchTerm" 
              class="form-control simple-search-input mr-3" 
              placeholder="Tìm kiếm danh mục" 
              [(ngModel)]="searchTerm"
              (input)="filterCategories()" 
            />
            
            <!-- Lọc theo trạng thái -->
            <select class="form-control" [(ngModel)]="selectedStatus" (change)="filterCategories()">
              <option value="">Tất cả trạng thái</option>
              <option value="active">Hoạt động</option>
              <option value="inactive">Không hoạt động</option>
            </select>
          </div>  
          <div class="card mt-3">
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-hover table-bordered text-nowrap">
                  <thead class="table-dark text-white text-center align-middle">
                    <tr>
                      <th scope="col" class="py-3">ID</th>
                      <th scope="col" class="py-3">Tên danh mục</th>
                      <th scope="col" class="py-3">Hình ảnh</th>
                      <th scope="col" class="py-3">Mô tả</th>
                      <th scope="col" class="py-3">Trạng thái</th>
                      <th scope="col" class="py-3">Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr
                      *ngFor="let category of getPagedData()"
                      [ngClass]="category.status === 'active' ? 'table-light' : 'table-danger'"
                    >
                      <th scope="row" class="text-center align-middle">{{ category.id }}</th>
                      <td class="text-center align-middle">{{ category.category_name }}</td>
                      <td class="text-center align-middle">
                        <img
                          [src]="getImageUrl(category.images)"
                          alt="{{ category.category_name }}"
                          class="img-thumbnail"
                          style="max-width: 60px; height: auto;"
                        />
                      </td>
                      <td class="text-center align-middle text-truncate" style="max-width: 150px">
                        {{ category.description }}
                      </td>
                      <td class="text-center align-middle">
                        <span
                          class="badge"
                          [ngClass]="category.status === 'active' ? 'bg-success' : 'bg-danger'"
                        >
                          {{ category.status === 'active' ? 'Kích hoạt' : 'Vô hiệu hóa' }}
                        </span>
                      </td>
                      <td class="text-center align-middle">
                        <div class="d-flex justify-content-center align-items-center gap-2">
                          <a [routerLink]="'edit/' + category.id" class="btn btn-sm btn-info">Sửa</a>
                          <button
                            type="button"
                            class="btn btn-sm btn-danger"
                            (click)="deleteCategory(category.id)"
                          >
                            Xóa
                          </button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                  
                </table>
                <div class="d-flex justify-content-center mt-3">
                  <nav>
                    <ul class="pagination">
                      <li class="page-item" [class.disabled]="currentPage === 1">
                        <button
                          class="page-link"
                          (click)="goToPage(currentPage - 1)"
                          [disabled]="currentPage === 1"
                        >
                          Trước
                        </button>
                      </li>
                      <li
                        class="page-item"
                        *ngFor="let page of getPaginationArray()"
                        [class.active]="page === currentPage"
                      >
                        <button class="page-link" (click)="goToPage(page)">{{ page }}</button>
                      </li>
                      <li
                        class="page-item"
                        [class.disabled]="currentPage === getTotalPages()"
                      >
                        <button
                          class="page-link"
                          (click)="goToPage(currentPage + 1)"
                          [disabled]="currentPage === getTotalPages()"
                        >
                          Tiếp theo
                        </button>
                      </li>
                    </ul>
                  </nav>
                </div>
              </div>
              <div *ngIf="filteredCategories.length === 0" class="text-center mt-3">
                <p class="text-muted">Không tìm thấy kết quả phù hợp.</p>
              </div>              
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
